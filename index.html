<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#092b40"><meta name="screen-orientation" content="landscape"><title>Semnome | Protótipo Oceano</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#092b40;font:14px system-ui;color:white;touch-action:none}
canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:16px;left:16px;background:#082536b8;padding:12px 14px;border:1px solid #ffffff20;border-radius:12px;max-width:235px}
#top strong{display:block;font-size:14px}#top small{display:block;opacity:.8;margin-top:4px}#status{margin-top:8px;color:#b9f8ff}
#pad{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:116px;height:116px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto;touch-action:none;display:grid;place-items:center}
#stick{width:55px;height:55px;background:#ffae40;border:3px solid #ffe8b8;border-radius:50%;box-shadow:0 5px 18px #0008;transform:translate(0,0)}

@media(orientation:landscape){#top{top:8px;left:10px;padding:6px 9px;max-width:225px;background:#082536a0}#top small{font-size:10px;margin-top:2px}#top strong{font-size:12px}#status{font-size:11px;margin-top:3px}#pad{opacity:.7}} 
#orientation{display:none;position:fixed;inset:0;background:#071d2d;z-index:30;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:16px;padding:30px;font-size:19px}
#orientation svg{width:95px;height:95px;stroke:#ffc16a;fill:none;stroke-width:3}
#orientation small{font-size:13px;color:#afd7e5;max-width:310px}
@media(orientation:portrait) and (pointer:coarse){#orientation{display:flex}#ui{visibility:hidden}}
</style>
</head>
<body>
<div id="loading">Preparando o oceano...</div><div id="orientation"><svg viewBox="0 0 100 100"><rect x="15" y="30" width="70" height="40" rx="8"/><path d="M22 20Q50 0 78 20 M73 11L79 20L68 22"/></svg><strong>Gire o celular para jogar</strong><small>Semnome foi projetado para a tela horizontal.</small><button id="landscapeFullscreen" style="padding:12px 18px;border-radius:10px;border:1px solid #ffffff55;background:#29546c;color:white;font:inherit">Tela cheia</button></div>
<div id="ui"><div id="top"><strong>SEMNOME · PROTÓTIPO 01</strong><small>Oceano de ação 3D • máquina provisória</small><div id="status">Velocidade: 0</div><small>Mobile: analógico move • arraste o mar para girar câmera<br>PC: W/↑ acelera, A/D ou ←/→ vira</small></div><div id="pad"><div id="stick"></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
document.getElementById('landscapeFullscreen').addEventListener('click',async()=>{try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape')}catch(e){console.info('Rotação automática indisponível; gire o dispositivo manualmente.')}});
const scene=new THREE.Scene(); scene.background=new THREE.Color('#8acdd9');scene.fog=new THREE.FogExp2('#659ead',.0011);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9faff,0x0e607b,2.2));
const sun=new THREE.DirectionalLight(0xfff1cf,2.5);sun.position.set(-50,100,40);scene.add(sun);
// Mesmo campo de ondas no shader e no CPU: soma de ondas direcionais.
const waves=[
{dx:1,dz:.25,a:2.8,k:.055,s:1.1},
{dx:-.3,dz:1,a:1.7,k:.092,s:1.6},
{dx:.75,dz:-.65,a:1.15,k:.17,s:2.0},
{dx:-.65,dz:-.75,a:.65,k:.29,s:2.8}
].map(w=>({...w,len:Math.hypot(w.dx,w.dz)}));
function height(x,z,t){let y=0;for(const w of waves)y+=w.a*Math.sin((x*w.dx+z*w.dz)/w.len*w.k-t*w.s);return y}
function normal(x,z,t){const h=.8;return new THREE.Vector3(height(x-h,z,t)-height(x+h,z,t),2*h,height(x,z-h,t)-height(x,z+h,t)).normalize()}
const uniforms={uTime:{value:0},uOffset:{value:new THREE.Vector2(0,0)}};
const water=new THREE.Mesh(new THREE.PlaneGeometry(1100,1100,240,240),new THREE.ShaderMaterial({
uniforms,side:THREE.DoubleSide,
vertexShader:`uniform float uTime;uniform vec2 uOffset;varying vec3 vPos;varying float vHeight;
float sea(vec2 p){return 2.8*sin(dot(p,normalize(vec2(1.,.25)))*.055-uTime*1.1)+1.7*sin(dot(p,normalize(vec2(-.3,1.)))*.092-uTime*1.6)+1.15*sin(dot(p,normalize(vec2(.75,-.65)))*.17-uTime*2.)+.65*sin(dot(p,normalize(vec2(-.65,-.75)))*.29-uTime*2.8);}
void main(){vec3 p=position;vec2 worldXZ=vec2(p.x,-p.y)+uOffset;p.z=sea(worldXZ);vHeight=p.z;vPos=vec3(worldXZ,p.z);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
fragmentShader:`varying vec3 vPos;varying float vHeight;
void main(){float foam=smoothstep(3.2,5.6,vHeight);float ribbons=pow(max(0.,sin(vPos.x*.29+vPos.y*.17+vHeight*1.4)),12.)*.17;
vec3 deep=vec3(.013,.22,.34),bright=vec3(.03,.54,.66);float m=clamp((vHeight+5.)/10.,0.,1.);vec3 c=mix(deep,bright,m);
c=mix(c,vec3(.63,.96,.95),foam*.82+ribbons);gl_FragColor=vec4(c,1.);}`
}));
water.rotation.x=-Math.PI/2;scene.add(water);
// Máquina provisória em geometria simples; sprites 16 direções entram após validação.
const ship=new THREE.Group();scene.add(ship);ship.scale.setScalar(2.1);
const hull=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.8,1.05,28),new THREE.MeshStandardMaterial({color:0xf18b33,metalness:.35,roughness:.45}));hull.position.y=.25;ship.add(hull);
const deck=new THREE.Mesh(new THREE.CylinderGeometry(1.95,2.15,.45,28),new THREE.MeshStandardMaterial({color:0xf0e6cf,metalness:.15,roughness:.6}));deck.position.y=.92;ship.add(deck);
const cockpit=new THREE.Mesh(new THREE.SphereGeometry(.95,16,10),new THREE.MeshStandardMaterial({color:0x174357,metalness:.4,roughness:.25}));cockpit.scale.set(1,.5,.85);cockpit.position.y=1.45;ship.add(cockpit);
const cannon=new THREE.Mesh(new THREE.CylinderGeometry(.43,.58,3.7,14),new THREE.MeshStandardMaterial({color:0x364958,metalness:.6,roughness:.35}));
cannon.rotation.x=Math.PI/2;cannon.position.set(0,1.2,-2.25);ship.add(cannon);
for(const x of [-1.6,1.6]){const motor=new THREE.Mesh(new THREE.BoxGeometry(.85,.75,1.25),new THREE.MeshStandardMaterial({color:0x2b4751,metalness:.5}));motor.position.set(x,.55,2.2);ship.add(motor)}
const shadow=new THREE.Mesh(new THREE.CircleGeometry(5.8,32),new THREE.MeshBasicMaterial({color:0x062836,transparent:true,opacity:.22,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.12;scene.add(shadow);
// NPC 01: patrulheiro de teste, geometria temporária até chegada dos sprites.
const npc=new THREE.Group();scene.add(npc);npc.scale.setScalar(1.9);
const npcHull=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.8,1.05,28),new THREE.MeshStandardMaterial({color:0xb94348,metalness:.35,roughness:.48}));npcHull.position.y=.25;npc.add(npcHull);
const npcDeck=new THREE.Mesh(new THREE.CylinderGeometry(1.95,2.15,.45,28),new THREE.MeshStandardMaterial({color:0x465c67,metalness:.3,roughness:.5}));npcDeck.position.y=.92;npc.add(npcDeck);
const npcCockpit=new THREE.Mesh(new THREE.SphereGeometry(.95,16,10),new THREE.MeshStandardMaterial({color:0x162c3d,metalness:.35,roughness:.3}));npcCockpit.scale.set(1,.5,.85);npcCockpit.position.y=1.45;npc.add(npcCockpit);
const npcCannon=new THREE.Mesh(new THREE.CylinderGeometry(.43,.58,3.7,14),new THREE.MeshStandardMaterial({color:0x293942,metalness:.6,roughness:.35}));npcCannon.rotation.x=Math.PI/2;npcCannon.position.set(0,1.2,-2.25);npc.add(npcCannon);
const npcData={x:14,z:-75,y:0,heading:0,speed:6,anchorX:14,anchorZ:-75};
const npcShadow=new THREE.Mesh(new THREE.CircleGeometry(5.1,32),new THREE.MeshBasicMaterial({color:0x062836,transparent:true,opacity:.2,depthWrite:false}));npcShadow.rotation.x=-Math.PI/2;scene.add(npcShadow);
// Sprite real do jogador: atlas 4x4 de 16 direções. Geometria fica apenas como fallback.
const PLAYER_ATLAS='./assets/ships/player/file_00000000bf14820e99bcf96b5bc8af0b.png';
const playerSpriteMaterial=new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide});
const playerSprite=new THREE.Mesh(new THREE.PlaneGeometry(13.8,13.8),playerSpriteMaterial);
playerSprite.visible=false;playerSprite.renderOrder=4;scene.add(playerSprite);
let playerAtlasReady=false;
new THREE.TextureLoader().load(PLAYER_ATLAS,texture=>{
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.magFilter=THREE.LinearFilter;texture.minFilter=THREE.LinearFilter;
  texture.wrapS=THREE.ClampToEdgeWrapping;texture.wrapT=THREE.ClampToEdgeWrapping;
  texture.repeat.set(.25,.25);
  playerSpriteMaterial.map=texture;playerSpriteMaterial.needsUpdate=true;
  playerAtlasReady=true;
  ship.visible=false;playerSprite.visible=true;
},undefined,error=>console.warn('Falha no sprite; usando modelo provisório.',error));
const input={x:0,y:0,magnitude:0,active:false};
let speed=0,heading=0,x=0,z=0,bob=0;
const pad=document.getElementById('pad'),stick=document.getElementById('stick');
let padPointer=null;let stickReferenceYaw=0;
function movePad(e){
  const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const dx=e.clientX-cx,dy=e.clientY-cy,radius=42;
  const d=Math.hypot(dx,dy),scale=d>0?Math.min(1,d/radius)/d:0;
  input.x=dx*scale;input.y=dy*scale;input.magnitude=Math.min(1,d/radius);
  stick.style.transform=`translate(${input.x*radius}px,${input.y*radius}px)`;
}
pad.addEventListener('pointerdown',e=>{
  if(padPointer!==null)return;
  stickReferenceYaw=heading+orbitCurrent;padPointer=e.pointerId;input.active=true;pad.setPointerCapture(e.pointerId);movePad(e);
});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)movePad(e)});
function releasePad(e){
  if(e.pointerId!==padPointer)return;
  padPointer=null;input.active=false;input.x=0;input.y=0;input.magnitude=0;
  stick.style.transform='translate(0,0)';
}
pad.addEventListener('pointerup',releasePad);pad.addEventListener('pointercancel',releasePad);
pad.addEventListener('lostpointercapture',releasePad);
const keys=new Set();addEventListener('keydown',e=>{if(['ArrowUp','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code)});
addEventListener('keyup',e=>keys.delete(e.code));
// Arrasto horizontal sobre o oceano orbita a câmera; não altera o rumo da máquina.
let orbitOffset=0,orbitCurrent=0,dragId=null,lastDragX=0;
renderer.domElement.style.touchAction='none';
renderer.domElement.addEventListener('pointerdown',e=>{
 if(dragId!==null || e.pointerType==='mouse'&&e.button!==0)return;
 dragId=e.pointerId;lastDragX=e.clientX;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId!==dragId)return;
 const dx=e.clientX-lastDragX;lastDragX=e.clientX;
 orbitOffset+=dx*0.0065;
});
function stopCameraDrag(e){if(e.pointerId===dragId)dragId=null}
renderer.domElement.addEventListener('pointerup',stopCameraDrag);
renderer.domElement.addEventListener('pointercancel',stopCameraDrag);
renderer.domElement.addEventListener('lostpointercapture',stopCameraDrag);
const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),wanted=new THREE.Vector3(),follow=new THREE.Vector3();let cameraReady=false;
function tick(){
requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;uniforms.uTime.value=t;
const keyboardGo=keys.has('KeyW')||keys.has('ArrowUp')||keys.has('Space');
const stickAmount=input.active&&input.magnitude>.13?(input.magnitude-.13)/.87:0;
const go=keyboardGo||stickAmount>0;
const turn=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);
let target=24*(keyboardGo?1:stickAmount); // joystick: distância define aceleração
const dirx=-Math.sin(heading),dirz=-Math.cos(heading);
const slope=(height(x+dirx*1.6,z+dirz*1.6,t)-height(x-dirx*1.6,z-dirz*1.6,t))/3.2;
target=Math.max(0,target-Math.max(0,slope)*8+Math.max(0,-slope)*2);
speed=THREE.MathUtils.damp(speed,target,go?4.8:7.8,dt);
if(speed>.35){
  if(stickAmount>0){
    // Ângulo absoluto desejado no plano: analógico pode apontar para qualquer 360°.
    // Giro pelo caminho mais curto, sem rotação contínua por manter o dedo na lateral.
    const desired=stickReferenceYaw-Math.atan2(input.x,-input.y);
    const delta=Math.atan2(Math.sin(desired-heading),Math.cos(desired-heading));
    const maxStep=2.85*Math.min(1,speed/7)*dt;
    heading+=THREE.MathUtils.clamp(delta,-maxStep,maxStep);
  }else{
    heading+=turn*2.35*Math.min(1,speed/7)*dt;
  }
}
x-=Math.sin(heading)*speed*dt;z-=Math.cos(heading)*speed*dt;
const bow=new THREE.Vector2(-Math.sin(heading),-Math.cos(heading)),side=new THREE.Vector2(Math.cos(heading),-Math.sin(heading));
const front=height(x+bow.x*1.5,z+bow.y*1.5,t),back=height(x-bow.x*1.5,z-bow.y*1.5,t);
const left=height(x-side.x*1.5,z-side.y*1.5,t),right=height(x+side.x*1.5,z+side.y*1.5,t);
const y=height(x,z,t);bob=THREE.MathUtils.damp(bob,y,5,dt);
ship.position.set(x,bob+1.45,z);ship.rotation.order='YXZ';ship.rotation.y=heading;
ship.rotation.x=THREE.MathUtils.damp(ship.rotation.x,THREE.MathUtils.clamp(Math.atan2(back-front,3),-.24,.24),4,dt);
ship.rotation.z=THREE.MathUtils.damp(ship.rotation.z,THREE.MathUtils.clamp(Math.atan2(left-right,3),-.23,.23),4,dt);
shadow.position.set(x,height(x,z,t)+.14,z);
// Patrulha lenta no oceano, com flutuação compartilhada com as ondas.
const patrol=t*.17;
const destX=npcData.anchorX+Math.sin(patrol)*15;
const destZ=npcData.anchorZ+Math.cos(patrol)*15;
const desiredYaw=-Math.atan2(destX-npcData.x,-(destZ-npcData.z));
const deltaYaw=Math.atan2(Math.sin(desiredYaw-npcData.heading),Math.cos(desiredYaw-npcData.heading));
npcData.heading+=THREE.MathUtils.clamp(deltaYaw,-1.3*dt,1.3*dt);
npcData.x-=Math.sin(npcData.heading)*npcData.speed*dt;
npcData.z-=Math.cos(npcData.heading)*npcData.speed*dt;
// Colisão circular XZ: empurrões sem dano, sem mudar a orientação comandada pelo jogador.
let dx=x-npcData.x,dz=z-npcData.z,dist=Math.hypot(dx,dz),minDist=10.6;
if(dist<minDist){
  if(dist<.001){dx=1;dz=0;dist=1}
  const overlap=minDist-dist,nx=dx/dist,nz=dz/dist;
  x+=nx*overlap*.65;z+=nz*overlap*.65;
  npcData.x-=nx*overlap*.35;npcData.z-=nz*overlap*.35;
  speed*=.94;
  ship.position.x=x;ship.position.z=z;
}
const ny=height(npcData.x,npcData.z,t);
npcData.y=THREE.MathUtils.damp(npcData.y,ny,4,dt);
npc.position.set(npcData.x,npcData.y+1.35,npcData.z);
npc.rotation.order='YXZ';npc.rotation.y=npcData.heading;
const nf=new THREE.Vector2(-Math.sin(npcData.heading),-Math.cos(npcData.heading)),ns=new THREE.Vector2(Math.cos(npcData.heading),-Math.sin(npcData.heading));
const nfront=height(npcData.x+nf.x*1.5,npcData.z+nf.y*1.5,t);
const nback=height(npcData.x-nf.x*1.5,npcData.z-nf.y*1.5,t);
const nleft=height(npcData.x-ns.x*1.5,npcData.z-ns.y*1.5,t);
const nright=height(npcData.x+ns.x*1.5,npcData.z+ns.y*1.5,t);
npc.rotation.x=THREE.MathUtils.damp(npc.rotation.x,THREE.MathUtils.clamp(Math.atan2(nback-nfront,3),-.24,.24),4,dt);
npc.rotation.z=THREE.MathUtils.damp(npc.rotation.z,THREE.MathUtils.clamp(Math.atan2(nleft-nright,3),-.23,.23),4,dt);
npcShadow.position.set(npcData.x,ny+.13,npcData.z);

// A malha acompanha o jogador com fases de onda em coordenadas globais. 
water.position.set(x,0,z);uniforms.uOffset.value.set(x,z);
// Câmera de ação: afastada, baixa, horizonte aparente e horizonte estável.
// Inclinação de observação menor do que a do protótipo anterior para evitar vista quase vertical.
// Não copiar bob/pitch/roll do casco para câmera (previne enjoo visual).
// Câmera de perseguição baixa: olhar quase horizontal com proa no terço inferior.
// Distância moderada mantém o jogador legível no celular; ponto focal remoto revela o céu.
const distance=THREE.MathUtils.lerp(30,36,Math.min(1,speed/24));
const cameraHeight=THREE.MathUtils.lerp(13,15,Math.min(1,speed/24));
orbitCurrent=THREE.MathUtils.damp(orbitCurrent,orbitOffset,9,dt);
const cameraYaw=heading+orbitCurrent;
wanted.set(x+Math.sin(cameraYaw)*distance,cameraHeight,z+Math.cos(cameraYaw)*distance);
const lookAhead=105;
follow.set(x-Math.sin(cameraYaw)*lookAhead,9,z-Math.cos(cameraYaw)*lookAhead);
// A câmera nunca copia os solavancos do barco ou a oscilação das ondas.
if(!cameraReady){camera.position.copy(wanted);camTarget.copy(follow);cameraReady=true}
camera.position.lerp(wanted,1-Math.exp(-1.8*dt));
camTarget.lerp(follow,1-Math.exp(-2.2*dt));
camera.lookAt(camTarget);
if(playerAtlasReady){
  // Cada quadro cobre 22,5°; a escolha respeita a câmera orbitável.
  const relativeAngle=Math.atan2(Math.sin(heading-cameraYaw),Math.cos(heading-cameraYaw));
  const frame=((Math.round(relativeAngle/(Math.PI*2)*16)%16)+16)%16;
  const column=frame%4,row=Math.floor(frame/4);
  playerSpriteMaterial.map.offset.set(column*.25,(3-row)*.25);
  playerSpriteMaterial.map.needsUpdate=true;
  playerSprite.position.set(x,bob+4.3,z);
  playerSprite.quaternion.copy(camera.quaternion);
}
document.getElementById('status').textContent='Velocidade: '+Math.round(speed)+'  |  Ondas ativas';
renderer.render(scene,camera)
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('loading').remove();tick();
</script></body></html>
